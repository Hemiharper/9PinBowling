<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thursday Club #129 - 9 Pin Bowling</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body { background-color: #131313; color: #F7E6C8; font-family: -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
        .tc-gradient { background: linear-gradient(135deg, #5E3273 0%, #3a1b49 100%); }
        .gold-glow { text-shadow: 0 0 12px rgba(195, 164, 93, 0.7); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes hatFloatDown {
            0% { transform: translateY(-220px) scale(1.3) rotate(-15deg); opacity: 0; }
            70% { transform: translateY(10px) scale(0.95) rotate(5deg); opacity: 1; }
            100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes bounceDance {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-12px) rotate(4deg); }
            75% { transform: translateY(-6px) rotate(-4deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-hat-float {
            animation: hatFloatDown 1.3s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        .animate-mascot-dance {
            animation: bounceDance 1.8s ease-in-out infinite;
        }
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const AIRTABLE_PAT = 'patmis6vFyZugWymr.206125d4815cfe4484eb63f772a18490a0c9f90e4a56a8cad638b33bfe38355b';
        const AIRTABLE_BASE_ID = 'appgoVZaRVO1YvLh6';
        const AIRTABLE_TABLE = 'Players';
        const SYNC_INTERVAL_MS = 2500; 

        const GEMINI_API_KEY = 'AQ.Ab8RN6L3JLRpSqMADupAHoV19yXxn4wDekFHSnAexC0vSn6IFg';

        const sfx = {
            thursday9: new Audio('thursday.mp3'),
            perfect9: new Audio('perfect.mp3'),
            fanfare: new Audio('fanfare.mp3')
        };

        sfx.thursday9.addEventListener('error', () => {
            sfx.thursday9.src = 'Comical_rubber_chick_%233-1787048808849.mp3';
        });

        const playSfx = (soundKey) => {
            const audio = sfx[soundKey];
            if (audio) {
                audio.muted = false;
                audio.currentTime = 0;
                audio.play().catch(e => console.log('Audio blocked:', e));
            }
        };

        const unlockAllAudio = () => {
            Object.values(sfx).forEach(a => {
                a.muted = true;
                a.play().then(() => {
                    a.pause();
                    a.currentTime = 0;
                    a.muted = false;
                }).catch(() => {});
            });
        };

        const PREFIXES = ['Kingpin', 'El Spin', 'Gutter Royalty', 'Split', 'Thunder', 'Sir', 'The Velvet', 'Uncle', 'Dr.', 'Captain', 'Turbo', 'Bad News', 'Wildcard', 'Nacho', 'Sensational', 'Slick'];
        const SUFFIXES = ['Machine', 'Bandit', 'Prince', 'Wizard', 'Viper', 'Assassin', 'Loco', 'Dynamite', 'Sizzler', 'Overdrive', 'Trouble', 'Thunderbolt', 'Maverick', 'El Diablo', 'Tornado'];
        
        const generateGeminiNickname = async (name) => {
            const cleanName = (name || 'Bowler').trim().split(' ')[0];
            
            const getRandomNick = () => {
                const prefix = PREFIXES[Math.floor(Math.random() * PREFIXES.length)];
                const suffix = SUFFIXES[Math.floor(Math.random() * SUFFIXES.length)];
                return `${prefix} ${cleanName} ${suffix}`;
            };

            if (!GEMINI_API_KEY || !GEMINI_API_KEY.startsWith('AIzaSy')) {
                return getRandomNick();
            }

            try {
                const prompt = `Generate ONE short, absurd, hilarious 1970s bowling nickname for a player named "${cleanName}". Examples: "El Spin Wizard", "Gutter Royalty", "Big Strike Energy". Return ONLY the nickname string without quotes.`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const nickname = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim().replace(/^["']|["']$/g, '');
                return nickname || getRandomNick();
            } catch (e) {
                return getRandomNick();
            }
        };

        const generateAvatarUrl = (seed) => {
            const cleanSeed = encodeURIComponent(seed || 'bowler');
            return `https://api.dicebear.com/7.x/fun-emoji/svg?seed=${cleanSeed}&radius=50&backgroundColor=5e3273`;
        };

        const Icon = ({ name, size = 24, color = "currentColor", className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current) {
                    iconRef.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.setAttribute('width', size);
                    i.setAttribute('height', size);
                    i.setAttribute('stroke', color);
                    i.setAttribute('class', className);
                    iconRef.current.appendChild(i);
                    lucide.createIcons({ root: iconRef.current });
                }
            }, [name, size, color, className]);
            return <span ref={iconRef} className={`inline-flex items-center justify-center ${className}`} />;
        };

        const initialPlayers = Array.from({ length: 11 }, (_, i) => ({
            id: `p${i + 1}`,
            recordId: null,
            name: '',
            nickname: '',
            officialScore: 0,
            perfectNines: 0,
            thursdayNines: 0,
            currentFrame: 1
        }));

        const App = () => {
            const [appPhase, setAppPhase] = useState(() => localStorage.getItem('tc_app_phase') || 'welcome');
            const [players, setPlayers] = useState(initialPlayers);
            const [activePlayerId, setActivePlayerId] = useState('p1');
            const [activeTab, setActiveTab] = useState('scoring');
            const [syncStatus, setSyncStatus] = useState('connecting');
            const [syncError, setSyncError] = useState(null);
            const [showResetModal, setShowResetModal] = useState(false);
            const [loadingAiId, setLoadingAiId] = useState(null);
            const [crownStage, setCrownStage] = useState('idle');

            // Touch Swipe Tracking
            const touchStartX = useRef(0);
            const touchEndX = useRef(0);

            useEffect(() => {
                localStorage.setItem('tc_app_phase', appPhase);
            }, [appPhase]);

            const fetchAirtable = async () => {
                if (!AIRTABLE_PAT) return;
                
                try {
                    const res = await fetch(`https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE}`, {
                        headers: { Authorization: `Bearer ${AIRTABLE_PAT}` }
                    });
                    
                    if (!res.ok) {
                        const err = await res.json();
                        setSyncError(`Airtable Error (${res.status}): ${err.error?.message || err.error || 'Failed'}`);
                        setSyncStatus('error');
                        return;
                    }

                    setSyncError(null);
                    const data = await res.json();
                    
                    if (data.records) {
                        setPlayers(prev => prev.map((p, idx) => {
                            const record = data.records.find(r => r.fields.PlayerID === p.id) || data.records[idx];
                            if (record) {
                                return {
                                    ...p,
                                    recordId: record.id,
                                    name: appPhase === 'setup' && p.name !== '' ? p.name : (record.fields.Name || p.name || ''),
                                    nickname: appPhase === 'setup' && p.nickname !== '' ? p.nickname : (record.fields.Nickname || p.nickname || ''),
                                    officialScore: record.fields.OfficialScore !== undefined ? Number(record.fields.OfficialScore) : 0,
                                    perfectNines: record.fields.PerfectNines !== undefined ? Number(record.fields.PerfectNines) : 0,
                                    thursdayNines: record.fields.ThursdayNines !== undefined ? Number(record.fields.ThursdayNines) : 0,
                                    currentFrame: record.fields.CurrentFrame !== undefined ? Number(record.fields.CurrentFrame) : 1
                                };
                            }
                            return p;
                        }));
                        setSyncStatus('synced');
                    }
                } catch (e) {
                    console.error("Airtable fetch error:", e);
                    setSyncError(`Network Error: ${e.message}`);
                    setSyncStatus('error');
                }
            };

            const pushToAirtable = async (player) => {
                if (!AIRTABLE_PAT) return;
                
                setSyncStatus('syncing');
                const fields = {
                    PlayerID: player.id,
                    Name: player.name || '',
                    Nickname: player.nickname || '',
                    OfficialScore: Number(player.officialScore) || 0,
                    PerfectNines: Number(player.perfectNines) || 0,
                    ThursdayNines: Number(player.thursdayNines) || 0,
                    CurrentFrame: Number(player.currentFrame) || 1
                };

                try {
                    let res;
                    if (player.recordId) {
                        res = await fetch(`https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE}/${player.recordId}`, {
                            method: 'PATCH',
                            headers: {
                                Authorization: `Bearer ${AIRTABLE_PAT}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ fields })
                        });
                    } else {
                        res = await fetch(`https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${AIRTABLE_TABLE}`, {
                            method: 'POST',
                            headers: {
                                Authorization: `Bearer ${AIRTABLE_PAT}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ fields })
                        });
                    }

                    if (!res.ok) {
                        const err = await res.json();
                        setSyncError(`Save Error (${res.status}): ${err.error?.message || JSON.stringify(err.error)}`);
                        setSyncStatus('error');
                        return;
                    }

                    const data = await res.json();
                    if (data.id && !player.recordId) {
                        setPlayers(prev => prev.map(p => p.id === player.id ? { ...p, recordId: data.id } : p));
                    }

                    setSyncError(null);
                    setSyncStatus('synced');
                } catch (e) {
                    console.error("Airtable update error:", e);
                    setSyncError(`Save Error: ${e.message}`);
                    setSyncStatus('error');
                }
            };

            const handleFullReset = async () => {
                setShowResetModal(false);
                setCrownStage('idle');
                localStorage.removeItem('tc_app_phase');
                setAppPhase('welcome');

                const resetRoster = players.map(p => ({
                    ...p,
                    name: '',
                    nickname: '',
                    officialScore: 0,
                    perfectNines: 0,
                    thursdayNines: 0,
                    currentFrame: 1
                }));

                setPlayers(resetRoster);
                for (const player of resetRoster) {
                    if (player.recordId) {
                        await pushToAirtable(player);
                    }
                }
            };

            useEffect(() => {
                fetchAirtable();
                const interval = setInterval(fetchAirtable, SYNC_INTERVAL_MS);
                return () => clearInterval(interval);
            }, [appPhase]);

            const updatePlayerLocal = (id, updates) => {
                setPlayers(prev => prev.map(p => p.id === id ? { ...p, ...updates } : p));
            };

            const updatePlayerAndSync = (id, updates) => {
                setPlayers(prev => {
                    const player = prev.find(p => p.id === id);
                    if (!player) return prev;
                    const updated = { ...player, ...updates };
                    pushToAirtable(updated);
                    return prev.map(p => p.id === id ? updated : p);
                });
            };

            // Swipe Handler Functions
            const handleTouchStart = (e) => {
                touchStartX.current = e.targetTouches[0].clientX;
                touchEndX.current = e.targetTouches[0].clientX;
            };

            const handleTouchMove = (e) => {
                touchEndX.current = e.targetTouches[0].clientX;
            };

            const handleTouchEnd = () => {
                const swipeDistance = touchStartX.current - touchEndX.current;
                const minSwipeDistance = 50;

                if (Math.abs(swipeDistance) > minSwipeDistance) {
                    const currentIndex = players.findIndex(p => p.id === activePlayerId);
                    if (currentIndex !== -1) {
                        let nextIndex;
                        if (swipeDistance > 0) {
                            // Swiped Left -> Next Player
                            nextIndex = (currentIndex + 1) % players.length;
                        } else {
                            // Swiped Right -> Previous Player
                            nextIndex = (currentIndex - 1 + players.length) % players.length;
                        }
                        setActivePlayerId(players[nextIndex].id);
                    }
                }
                touchStartX.current = 0;
                touchEndX.current = 0;
            };

            const calculateTotal = (p) => p.officialScore + (p.perfectNines * 25) + (p.thursdayNines * 10);
            
            const activePlayer = players.find(p => p.id === activePlayerId) || players[0];
            const sortedLeaderboard = [...players].sort((a, b) => calculateTotal(b) - calculateTotal(a));
            const winner = sortedLeaderboard[0] || players[0];
            
            if (appPhase === 'welcome') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center">
                        <img 
                            src="Chicken.jpeg" 
                            alt="Mascot" 
                            className="w-48 mb-6 drop-shadow-2xl rounded-2xl border-2 border-[#C3A45D]" 
                            onError={(e) => { e.target.src = 'TC-Hats_4_Front_3.png'; }} 
                        />
                        <h1 className="text-4xl font-black mb-2 uppercase tracking-wider text-[#C3A45D] gold-glow leading-tight">
                            Thursday Club<br/>9 Pin Championship
                        </h1>
                        <h2 className="text-xl text-[#82469d] font-bold mb-8 uppercase tracking-widest">TC #129</h2>

                        <div className="bg-[#231e2b] p-6 rounded-2xl border border-[#5E3273] mb-8 w-full max-w-md text-left shadow-lg">
                            <h3 className="text-xl font-black text-[#C3A45D] mb-4 border-b border-[#5E3273] pb-3 uppercase flex items-center gap-2">
                                <Icon name="scroll" size="20" /> How It Works
                            </h3>
                            <p className="text-sm mb-5 text-gray-300">This is <strong className="text-white">NOT</strong> regular bowling. We use the official alley score, but overlay our own championship rules.</p>
                            <ul className="text-sm space-y-4">
                                <li className="flex gap-3">
                                    <div className="bg-[#5E3273] p-2 rounded-lg h-min"><Icon name="flame" size="18" color="#C3A45D" /></div>
                                    <div>
                                        <strong className="text-[#C3A45D] block text-base">Perfect Nine (+25 pts)</strong>
                                        <span className="text-gray-400">Knock down exactly 9 pins on your <strong>FIRST</strong> ball.</span>
                                    </div>
                                </li>
                                <li className="flex gap-3">
                                    <div className="bg-[#5E3273] p-2 rounded-lg h-min"><Icon name="sparkles" size="18" color="#C3A45D" /></div>
                                    <div>
                                        <strong className="text-[#C3A45D] block text-base">Thursday Nine (+10 pts)</strong>
                                        <span className="text-gray-400">Knock down exactly 9 pins on your <strong>SECOND</strong> ball.</span>
                                    </div>
                                </li>
                                <li className="flex gap-3">
                                    <div className="bg-[#231e2b] border border-gray-600 p-2 rounded-lg h-min"><Icon name="target" size="18" color="white" /></div>
                                    <div>
                                        <strong className="text-white block text-base">Official Score</strong>
                                        <span className="text-gray-400">Whatever the screen says, add it to your total.</span>
                                    </div>
                                </li>
                            </ul>
                        </div>

                        <button
                            onClick={() => {
                                unlockAllAudio();
                                setAppPhase('setup');
                            }}
                            className="bg-[#C3A45D] text-[#131313] text-2xl font-black py-5 px-12 rounded-full mb-10 shadow-[0_0_30px_rgba(195,164,93,0.5)] transform hover:scale-105 active:scale-95 transition-all w-full max-w-md uppercase"
                        >
                            Let's Begin
                        </button>

                        <div className="text-[11px] text-[#82469d] max-w-md opacity-80 border-t border-[#5E3273] pt-6 pb-10">
                            <p className="mb-2 font-bold text-center tracking-widest uppercase">Terms of Play</p>
                            <p className="text-justify leading-relaxed">
                                "As a player of 9Pin bowling you acknowledge that this is a curious, original and noteworthy spin on ordinary ten pin bowling, an activity that was a TC event 10 years prior to this event. As a result of all players acknowledgement, all participants will forfeit any right to assign a black mark to the organiser of this event. Stick that up ya bum Will."
                            </p>
                        </div>
                    </div>
                );
            }

            if (appPhase === 'setup') {
                return (
                    <div className="min-h-screen p-4 pb-32 max-w-md mx-auto">
                        <div className="text-center mb-8 pt-4">
                            <h1 className="text-3xl font-black text-[#C3A45D] mb-2">Tournament Roster</h1>
                            <p className="text-[#82469d]">Enter player names & generate AI identities.</p>
                        </div>
                        
                        <div className="space-y-4">
                            {players.map((p, idx) => (
                                <div key={p.id} className="bg-[#231e2b] p-4 rounded-xl border border-[#5E3273] flex items-center gap-3">
                                    <img 
                                        src={generateAvatarUrl(p.nickname || p.name || p.id)} 
                                        alt="Avatar" 
                                        className="w-12 h-12 rounded-full border-2 border-[#C3A45D] bg-[#1c1822] shrink-0"
                                    />
                                    
                                    <div className="flex-1 space-y-2">
                                        <input 
                                            type="text" 
                                            placeholder={`Player ${idx + 1} Name`} 
                                            value={p.name}
                                            onChange={(e) => updatePlayerLocal(p.id, { name: e.target.value })}
                                            onBlur={() => pushToAirtable(p)}
                                            className="w-full bg-[#1c1822] border border-[#5E3273] rounded p-2 text-white text-sm placeholder-gray-500"
                                        />
                                        <div className="flex gap-2">
                                            <input 
                                                type="text" 
                                                placeholder="AI Nickname" 
                                                value={p.nickname}
                                                onChange={(e) => updatePlayerLocal(p.id, { nickname: e.target.value })}
                                                onBlur={() => pushToAirtable(p)}
                                                className="w-full bg-[#1c1822] border border-[#5E3273] rounded p-2 text-[#C3A45D] font-bold text-sm placeholder-gray-500"
                                            />
                                            <button 
                                                onClick={async () => {
                                                    setLoadingAiId(p.id);
                                                    const aiNick = await generateGeminiNickname(p.name || `Player ${idx + 1}`);
                                                    updatePlayerAndSync(p.id, { nickname: aiNick });
                                                    setLoadingAiId(null);
                                                }}
                                                disabled={loadingAiId === p.id}
                                                className="bg-[#5E3273] hover:bg-[#82469d] px-3 py-2 rounded text-white text-xs font-bold shrink-0 flex items-center gap-1 disabled:opacity-50"
                                            >
                                                {loadingAiId === p.id ? (
                                                    <Icon name="loader-2" size="16" className="animate-spin" />
                                                ) : (
                                                    <><Icon name="sparkles" size="16" color="#C3A45D" /> AI</>
                                                )}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <div className="fixed bottom-0 left-0 right-0 p-4 bg-[#131313] border-t border-[#5E3273] z-10 flex gap-2">
                            <button 
                                onClick={async () => {
                                    unlockAllAudio();
                                    for (const p of players) {
                                        if (p.name || p.nickname) {
                                            await pushToAirtable(p);
                                        }
                                    }
                                    setAppPhase('game');
                                }}
                                className="w-full bg-[#C3A45D] text-[#131313] font-black py-4 rounded-lg uppercase tracking-wider shadow-lg"
                            >
                                Lock Roster & Play
                            </button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col pb-20">
                    <header className="tc-gradient p-4 sticky top-0 z-20 shadow-md">
                        <div className="flex justify-between items-center max-w-md mx-auto">
                            <div className="flex items-center gap-2">
                                <div className="bg-[#131313] p-1 rounded-full border border-[#C3A45D]">
                                    <img 
                                        src="Chicken.jpeg" 
                                        className="w-8 h-8 object-cover rounded-full" 
                                        alt="TC" 
                                        onError={(e) => { e.target.src = 'TC-Hats_4_Front_3.png'; }} 
                                    />
                                </div>
                                <div>
                                    <div className="text-[10px] font-bold text-[#C3A45D] uppercase tracking-widest bg-[#131313] px-2 py-0.5 rounded-full inline-block mb-1">TC #129</div>
                                    <h1 className="text-sm font-black uppercase text-white leading-tight">9 Pin Championship</h1>
                                </div>
                            </div>
                            <div className="flex items-center gap-3">
                                <button 
                                    onClick={() => setShowResetModal(true)} 
                                    className="p-1.5 bg-[#131313]/50 border border-[#5E3273] rounded-lg text-red-400 hover:text-red-300" 
                                    title="Reset Game"
                                >
                                    <Icon name="rotate-ccw" size="18" />
                                </button>
                                <div className={`w-3 h-3 rounded-full ${syncStatus === 'synced' ? 'bg-green-500' : syncStatus === 'syncing' ? 'bg-yellow-500' : 'bg-red-500'}`} title={`Sync Status: ${syncStatus}`}></div>
                            </div>
                        </div>

                        {syncError && (
                            <div className="mt-2 p-2 bg-red-900/80 border border-red-500 rounded text-red-200 text-[10px] font-bold text-center">
                                {syncError}
                            </div>
                        )}
                    </header>

                    {showResetModal && (
                        <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
                            <div className="bg-[#231e2b] border-2 border-red-500 p-6 rounded-2xl max-w-xs w-full text-center space-y-4">
                                <Icon name="alert-triangle" size="48" color="#ef4444" className="mx-auto" />
                                <h3 className="text-xl font-black text-white uppercase">Reset Tournament?</h3>
                                <p className="text-xs text-gray-300">This will wipe all scores, frames, and player names in Airtable and restart for everyone.</p>
                                <div className="flex gap-2 pt-2">
                                    <button onClick={() => setShowResetModal(false)} className="flex-1 bg-gray-700 text-white font-bold py-2 rounded-lg text-sm">Cancel</button>
                                    <button onClick={handleFullReset} className="flex-1 bg-red-600 text-white font-black py-2 rounded-lg text-sm uppercase">Yes, Reset</button>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 max-w-md w-full mx-auto relative">
                        {activeTab === 'scoring' && (
                            <div className="p-4 space-y-4">
                                <div className="mb-4">
                                    <div className="flex justify-between items-center mb-2">
                                        <div className="text-xs text-[#C3A45D] font-bold uppercase">Select Active Bowler</div>
                                        <div className="text-[10px] text-gray-400 italic">👈 Swipe card to switch 👉</div>
                                    </div>
                                    <div className="flex overflow-x-auto gap-2 hide-scrollbar pb-2">
                                        {players.map(p => (
                                            <button 
                                                key={p.id}
                                                onClick={() => setActivePlayerId(p.id)}
                                                className={`flex-shrink-0 p-3 rounded-lg border-2 text-left min-w-[130px] transition-all flex items-center gap-2 ${activePlayerId === p.id ? 'border-[#C3A45D] bg-[#231e2b]' : 'border-[#5E3273] bg-[#1c1822] opacity-70'}`}
                                            >
                                                <img src={generateAvatarUrl(p.nickname || p.name || p.id)} className="w-8 h-8 rounded-full bg-black shrink-0" alt="" />
                                                <div className="min-w-0">
                                                    <div className="font-bold text-white text-xs truncate">{p.nickname || p.name || 'Unknown'}</div>
                                                    <div className="text-[10px] text-[#82469d]">F: {p.currentFrame}/10</div>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* Active Bowler Card with Touch Swipe Enabled */}
                                <div 
                                    onTouchStart={handleTouchStart}
                                    onTouchMove={handleTouchMove}
                                    onTouchEnd={handleTouchEnd}
                                    className="bg-[#231e2b] rounded-2xl border border-[#5E3273] overflow-hidden shadow-lg touch-pan-y"
                                >
                                    <div className="p-4 border-b border-[#5E3273] flex justify-between items-center bg-[#1c1822]">
                                        <div className="flex items-center gap-3">
                                            <img src={generateAvatarUrl(activePlayer.nickname || activePlayer.name || activePlayer.id)} className="w-12 h-12 rounded-full border-2 border-[#C3A45D] bg-black" alt="" />
                                            <div>
                                                <div className="text-xs text-[#C3A45D] font-bold uppercase tracking-wider mb-0.5">Frame {Math.min(activePlayer.currentFrame, 10)} of 10</div>
                                                <h2 className="text-xl font-black text-white leading-tight break-words">{activePlayer.nickname || activePlayer.name || 'Select a player'}</h2>
                                            </div>
                                        </div>
                                        <div className="text-right shrink-0 ml-2">
                                            <div className="text-[10px] text-gray-400 uppercase">Total Pts</div>
                                            <div className="text-3xl font-black text-[#C3A45D]">{calculateTotal(activePlayer)}</div>
                                        </div>
                                    </div>

                                    <div className="p-4 space-y-5">
                                        <div className="bg-[#1c1822] p-4 rounded-xl border border-[#5E3273] flex justify-between items-center">
                                            <div>
                                                <div className="font-bold text-white mb-1">Official Alley Score</div>
                                                <div className="text-xs text-gray-400">Update directly from screen</div>
                                            </div>
                                            <input 
                                                type="number" 
                                                value={activePlayer.officialScore === 0 ? '' : activePlayer.officialScore}
                                                onChange={(e) => updatePlayerAndSync(activePlayer.id, { officialScore: parseInt(e.target.value) || 0 })}
                                                className="bg-[#131313] border-2 border-[#5E3273] rounded-lg text-2xl font-black text-center w-24 py-2 text-white"
                                                placeholder="0"
                                            />
                                        </div>

                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => {
                                                    playSfx('perfect9');
                                                    updatePlayerAndSync(activePlayer.id, { perfectNines: activePlayer.perfectNines + 1 });
                                                }}
                                                className="flex-1 bg-[#5E3273] border-2 border-[#82469d] rounded-xl p-4 active:scale-95 transition-transform flex flex-col items-center justify-center text-center shadow-lg"
                                            >
                                                <div className="flex items-center gap-2 text-white font-black text-lg mb-1">
                                                    <Icon name="flame" color="#C3A45D" /> PERFECT 9
                                                </div>
                                                <div className="bg-white/10 text-white text-xs px-2 py-1 rounded font-bold uppercase mb-2">+25 Points</div>
                                                <div className="text-sm text-[#C3A45D]">Total Count: {activePlayer.perfectNines}</div>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    if(activePlayer.perfectNines > 0) updatePlayerAndSync(activePlayer.id, { perfectNines: activePlayer.perfectNines - 1 });
                                                }}
                                                className="w-16 bg-red-900/30 border-2 border-red-900/50 rounded-xl flex flex-col items-center justify-center text-red-500 text-[10px] font-bold active:bg-red-900/50"
                                            >
                                                <Icon name="minus" size="20" className="mb-1" />
                                                UNDO
                                            </button>
                                        </div>

                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => {
                                                    playSfx('thursday9');
                                                    updatePlayerAndSync(activePlayer.id, { thursdayNines: activePlayer.thursdayNines + 1 });
                                                }}
                                                className="flex-1 bg-[#1c1822] border-2 border-[#C3A45D] rounded-xl p-4 active:scale-95 transition-transform flex flex-col items-center justify-center text-center shadow-[0_0_15px_rgba(195,164,93,0.1)]"
                                            >
                                                <div className="flex items-center gap-2 text-[#C3A45D] font-black text-lg mb-1">
                                                    <Icon name="sparkles" /> THURSDAY 9
                                                </div>
                                                <div className="bg-[#C3A45D]/10 text-[#C3A45D] text-xs px-2 py-1 rounded font-bold uppercase mb-2">+10 Points</div>
                                                <div className="text-sm text-gray-400">Total Count: {activePlayer.thursdayNines}</div>
                                            </button>
                                            <button 
                                                onClick={() => {
                                                    if(activePlayer.thursdayNines > 0) updatePlayerAndSync(activePlayer.id, { thursdayNines: activePlayer.thursdayNines - 1 });
                                                }}
                                                className="w-16 bg-red-900/30 border-2 border-red-900/50 rounded-xl flex flex-col items-center justify-center text-red-500 text-[10px] font-bold active:bg-red-900/50"
                                            >
                                                <Icon name="minus" size="20" className="mb-1" />
                                                UNDO
                                            </button>
                                        </div>
                                    </div>

                                    <div className="p-4 bg-[#1c1822] border-t border-[#5E3273]">
                                        <button 
                                            onClick={() => updatePlayerAndSync(activePlayer.id, { currentFrame: Math.min(10, activePlayer.currentFrame + 1) })}
                                            disabled={activePlayer.currentFrame >= 10}
                                            className="w-full bg-white text-black font-black py-4 rounded-lg uppercase tracking-wider flex items-center justify-center gap-2 disabled:opacity-50 disabled:bg-gray-600"
                                        >
                                            {activePlayer.currentFrame >= 10 ? 'FINISHED' : `ADVANCE TO FRAME ${activePlayer.currentFrame + 1}`}
                                            {activePlayer.currentFrame < 10 && <Icon name="chevron-right" />}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'standings' && (
                            <div className="p-4 space-y-3">
                                <h2 className="text-2xl font-black text-[#C3A45D] mb-4 uppercase">Live Leaderboard</h2>
                                {sortedLeaderboard.map((p, index) => (
                                    <div key={p.id} className={`flex items-center gap-3 p-3 rounded-xl border ${index === 0 ? 'bg-[#C3A45D]/10 border-[#C3A45D]' : 'bg-[#231e2b] border-[#5E3273]'}`}>
                                        <div className={`w-7 h-7 rounded-full flex items-center justify-center font-black text-xs shrink-0 ${index === 0 ? 'bg-[#C3A45D] text-black' : index === 1 ? 'bg-gray-300 text-black' : index === 2 ? 'bg-[#cd7f32] text-white' : 'bg-[#1c1822] text-gray-500'}`}>
                                            {index + 1}
                                        </div>
                                        <img src={generateAvatarUrl(p.nickname || p.name || p.id)} className="w-10 h-10 rounded-full border border-[#C3A45D] bg-black shrink-0" alt="" />
                                        <div className="flex-1 min-w-0">
                                            <div className="font-bold text-white truncate">{p.nickname || p.name}</div>
                                            <div className="text-[10px] text-[#82469d] uppercase">F: {p.currentFrame}/10 • Official: {p.officialScore}</div>
                                        </div>
                                        <div className="text-right shrink-0">
                                            <div className="text-2xl font-black text-[#C3A45D]">{calculateTotal(p)}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'stats' && (
                            <div className="p-4 space-y-4">
                                <h2 className="text-2xl font-black text-[#C3A45D] mb-4 uppercase">Championship Stats</h2>
                                <div className="bg-[#231e2b] p-4 rounded-xl border border-[#5E3273]">
                                    <div className="text-[#C3A45D] text-xs font-bold uppercase mb-2">Most Perfect Nines</div>
                                    <div className="text-2xl font-black text-white">
                                        {[...players].sort((a,b)=>b.perfectNines - a.perfectNines)[0]?.nickname || 'None yet'} 
                                        <span className="text-[#82469d] ml-2">({[...players].sort((a,b)=>b.perfectNines - a.perfectNines)[0]?.perfectNines || 0})</span>
                                    </div>
                                </div>
                                <div className="bg-[#231e2b] p-4 rounded-xl border border-[#5E3273]">
                                    <div className="text-[#C3A45D] text-xs font-bold uppercase mb-2">Most Thursday Nines</div>
                                    <div className="text-2xl font-black text-white">
                                        {[...players].sort((a,b)=>b.thursdayNines - a.thursdayNines)[0]?.nickname || 'None yet'} 
                                        <span className="text-[#82469d] ml-2">({[...players].sort((a,b)=>b.thursdayNines - a.thursdayNines)[0]?.thursdayNines || 0})</span>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'podium' && (
                            <div className="p-4 h-full flex flex-col items-center justify-center text-center bg-black min-h-screen">
                                <h2 className="text-2xl font-black text-white mb-6 uppercase">Awards Ceremony</h2>
                                
                                {players.every(p => p.currentFrame >= 10) ? (
                                    <button 
                                        onClick={() => {
                                            playSfx('fanfare');
                                            setCrownStage('crowning');

                                            const duration = 5 * 1000;
                                            const end = Date.now() + duration;
                                            (function frame() {
                                                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#5E3273', '#C3A45D'] });
                                                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#5E3273', '#C3A45D'] });
                                                if (Date.now() < end) requestAnimationFrame(frame);
                                            }());

                                            setTimeout(() => {
                                                setCrownStage('crowned');
                                            }, 1300);
                                        }}
                                        className="bg-[#C3A45D] text-black font-black text-2xl py-6 px-8 rounded-2xl w-full shadow-[0_0_30px_rgba(195,164,93,0.5)] transform hover:scale-105 active:scale-95 transition-all mb-8 uppercase leading-tight"
                                    >
                                        Crown The<br/>Champion
                                    </button>
                                ) : (
                                    <div className="bg-[#1c1822] border border-[#5E3273] p-8 rounded-2xl text-gray-500 mb-8 w-full">
                                        <Icon name="lock" size="48" className="mx-auto mb-4 opacity-50" />
                                        <p className="font-bold uppercase tracking-wider text-sm">Finish all 10 frames<br/>to unlock ceremony</p>
                                    </div>
                                )}

                                {/* Animated Mascot & Floating Crown Container (Pure Black Background) */}
                                <div className="relative w-full h-72 flex justify-center items-end border-b-4 border-[#C3A45D] bg-black overflow-hidden">
                                    {crownStage === 'idle' && (
                                        <img 
                                            src="Chicken no hat.jpeg" 
                                            className="w-52 mb-1" 
                                            alt="Chicken No Hat"
                                            onError={(e) => { e.target.src = 'TC-Hats_4_Front_3.png'; }}
                                        />
                                    )}

                                    {crownStage === 'crowning' && (
                                        <div className="relative flex justify-center items-end w-full h-full bg-black">
                                            <img 
                                                src="Hat.jpeg" 
                                                className="w-32 absolute top-1 z-10 animate-hat-float" 
                                                alt="Floating Hat"
                                            />
                                            <img 
                                                src="Chicken no hat.jpeg" 
                                                className="w-52 mb-1" 
                                                alt="Chicken No Hat"
                                            />
                                        </div>
                                    )}

                                    {crownStage === 'crowned' && (
                                        <img 
                                            src="Chicken.jpeg" 
                                            className="w-52 mb-1 animate-mascot-dance" 
                                            alt="Champion Chicken"
                                        />
                                    )}
                                    <div className="text-[#C3A45D] text-xs font-bold uppercase tracking-widest absolute -bottom-6">Podium</div>
                                </div>

                                {/* Prominent Winner Name & Score Display */}
                                {crownStage !== 'idle' && (
                                    <div className="mt-8 p-4 bg-[#231e2b] border-2 border-[#C3A45D] rounded-2xl w-full animate-fade-in shadow-[0_0_25px_rgba(195,164,93,0.3)]">
                                        <div className="text-[#C3A45D] text-xs font-bold uppercase tracking-widest mb-1 flex items-center justify-center gap-1">
                                            <Icon name="crown" size="16" color="#C3A45D" /> Official Champion <Icon name="crown" size="16" color="#C3A45D" />
                                        </div>
                                        <div className="text-3xl font-black text-white uppercase tracking-wide gold-glow leading-tight break-words">
                                            {winner.nickname || winner.name || 'The Champion'}
                                        </div>
                                        <div className="text-sm font-bold text-[#82469d] mt-2">
                                            Total Score: <span className="text-[#C3A45D] text-lg font-black">{calculateTotal(winner)}</span> PTS
                                        </div>
                                    </div>
                                )}

                                <div className="mt-12 space-y-4 pb-8">
                                    <button 
                                        onClick={() => setPlayers(prev => prev.map(p => ({ ...p, currentFrame: 10 })))}
                                        className="block text-[10px] text-[#82469d] hover:text-[#C3A45D] transition-colors underline uppercase tracking-wider mx-auto"
                                    >
                                        [Dev] Fast-Forward Game to Test Animation
                                    </button>
                                    <button 
                                        onClick={() => setShowResetModal(true)}
                                        className="block text-[10px] text-red-500 hover:text-red-400 transition-colors underline uppercase tracking-wider mx-auto font-bold"
                                    >
                                        [Dev] Reset Tournament Data
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    <nav className="fixed bottom-0 left-0 right-0 bg-[#131313] border-t border-[#5E3273] flex justify-around p-2 pb-6 z-20 shadow-[0_-10px_20px_rgba(0,0,0,0.5)]">
                        <button onClick={() => setActiveTab('scoring')} className={`flex flex-col items-center p-2 ${activeTab === 'scoring' ? 'text-[#C3A45D]' : 'text-gray-500'}`}>
                            <Icon name="target" />
                            <span className="text-[10px] mt-1 font-bold uppercase">Scoring</span>
                        </button>
                        <button onClick={() => setActiveTab('standings')} className={`flex flex-col items-center p-2 ${activeTab === 'standings' ? 'text-[#C3A45D]' : 'text-gray-500'}`}>
                            <Icon name="award" />
                            <span className="text-[10px] mt-1 font-bold uppercase">Standings</span>
                        </button>
                        <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center p-2 ${activeTab === 'stats' ? 'text-[#C3A45D]' : 'text-gray-500'}`}>
                            <Icon name="bar-chart-2" />
                            <span className="text-[10px] mt-1 font-bold uppercase">Stats</span>
                        </button>
                        <button onClick={() => setActiveTab('podium')} className={`flex flex-col items-center p-2 ${activeTab === 'podium' ? 'text-[#C3A45D]' : 'text-gray-500'}`}>
                            <Icon name="crown" />
                            <span className="text-[10px] mt-1 font-bold uppercase">Podium</span>
                        </button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
